# The Rust version for this repo, wherever cargo runs (dev container, CI, your laptop): rustup reads
# this file and installs exactly this toolchain, so everyone builds with the same compiler.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# musl: a fully static server binary that runs on any x86-64 Linux (deploy/server/build.sh)
targets = ["x86_64-unknown-linux-musl"]
profile = "minimal"
