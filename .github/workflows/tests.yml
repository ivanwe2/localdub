name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg with libass, hunspell + Bulgarian, caption font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg hunspell hunspell-bg fontconfig fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes src tests
      - name: Tests (the slow ones run whole videos against fake model servers)
        run: python -m pytest -q
