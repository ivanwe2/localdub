name: tests

on:
  push:
    branches: [main]      # pushes to other branches are tested through their pull request
  pull_request:

# A newer push to the same pull request cancels the run that is still going on the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg with libass, hunspell + Bulgarian, caption font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg hunspell hunspell-bg fontconfig fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes src tests
      - name: Tests (the slow ones run whole videos against fake model servers)
        run: python -m pytest -q
