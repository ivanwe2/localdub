name: tests

on:
  push:
    branches: [main]      # pushes to other branches are tested through their pull request
  pull_request:

# A newer push to the same pull request cancels the run that is still going on the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # normally ~2 min; a hang (e.g. a slow package mirror) fails instead of blocking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg with libass, hunspell + Bulgarian, caption font)
        timeout-minutes: 8
        # a slow mirror once hung this step for 8 minutes: give up on a stalled connection and retry
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y ffmpeg hunspell hunspell-bg fontconfig fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes src tests deploy
      - name: Tests (the slow ones run whole videos against fake model servers)
        run: python -m pytest -q

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      # keeps compiled dependencies between runs; third-party, so pinned to an exact commit
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
