name: docker

# The localdub image (Dockerfile): built and smoke-tested on every pull request that touches it,
# and on merges to main also published as ghcr.io/<owner>/localdub (tags: latest and the commit),
# so `docker compose up -d` gets the latest. Every Monday it's rebuilt for a fresh yt-dlp, whose
# sites change often.
#
# Only GitHub's own actions and the docker CLI run here: the npm, cargo and pip packages run inside
# the image build, which never sees the token; the token is used only to push, after the tests.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/docker/**"
      - "deploy/server/yt-dlp.sh"
      - "src/**"
      - "pyproject.toml"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/docker/**"
      - "deploy/server/yt-dlp.sh"
      - "src/**"
      - "pyproject.toml"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # to push to ghcr.io (not on pull requests)
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t localdub:test .
      - name: Smoke test
        run: |
          docker run -d --name localdub -p 127.0.0.1:8080:8080 -e LOCALDUB_LLM_URL=http://127.0.0.1:9 localdub:test
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'          # the page
          curl -fsS http://127.0.0.1:8080/api/runs | grep -qx '\[\]'      # the engine's home, empty
          docker exec localdub localdub --version
          docker exec localdub yt-dlp --version
          docker exec localdub deno --version
          # the tools must pass (the model server isn't there, so those lines fail on purpose)
          docker exec localdub localdub check --json > check.jsonl || true
          cat check.jsonl
          for tool in ffmpeg ffprobe hunspell "ffmpeg can burn in captions (libass)" "caption font (DejaVu Sans)"; do
            jq -e --arg t "$tool" 'select(.event == "check" and .what == $t and .ok)' check.jsonl > /dev/null \
              || { echo "check failed: $tool"; exit 1; }
          done
          # every language's dictionary is in place
          docker exec localdub localdub languages --json | jq -e 'select(.event == "languages") |
            [.languages[] | select(.dictionary != null and (.dictionary_installed | not))] | length == 0'
      - name: Logs
        if: always()
        run: docker logs localdub || true
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag localdub:test "$image:latest"
          docker tag localdub:test "$image:${GITHUB_SHA::7}"
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
